[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "verdictlens"
version = "0.1.0"
description = "Local pairwise AI judge calibration and blinded adjudication"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
[project.scripts]
verdictlens = "verdictlens.__main__:main"
[tool.setuptools]
packages = ["verdictlens"]
[tool.setuptools.package-data]
verdictlens = ["workbench.html"]
